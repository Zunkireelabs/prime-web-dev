<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Headset Shape Test</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #1a1815; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px; }
  .frame { position: relative; width: 100%; max-width: 960px; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame svg { display: block; width: 100%; height: auto; position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="frame">
  <img src="/images/spaces/living-room.jpg" alt="" />
  <svg viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <!-- Dark mask with headset cutout -->
    <path
      d="M 0,0 H 1200 V 480 H 0 Z
         M 80,20 H 500 Q 560,20 560,80 V 155
         C 560,215 640,215 640,155
         V 80 Q 640,20 700,20 H 1120 Q 1180,20 1180,80
         V 400 Q 1180,460 1120,460 H 700 Q 640,460 640,400
         V 325 C 640,265 560,265 560,325
         V 400 Q 560,460 500,460 H 80 Q 20,460 20,400
         V 80 Q 20,20 80,20 Z"
      fill="#1a1815"
      fill-rule="evenodd"
    />

    <!-- White outline -->
    <path
      d="M 80,20 H 500 Q 560,20 560,80 V 155
         C 560,215 640,215 640,155
         V 80 Q 640,20 700,20 H 1120 Q 1180,20 1180,80
         V 400 Q 1180,460 1120,460 H 700 Q 640,460 640,400
         V 325 C 640,265 560,265 560,325
         V 400 Q 560,460 500,460 H 80 Q 20,460 20,400
         V 80 Q 20,20 80,20 Z"
      fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="3"
    />

    <!-- Accent gold outline with glow -->
    <path
      d="M 80,20 H 500 Q 560,20 560,80 V 155
         C 560,215 640,215 640,155
         V 80 Q 640,20 700,20 H 1120 Q 1180,20 1180,80
         V 400 Q 1180,460 1120,460 H 700 Q 640,460 640,400
         V 325 C 640,265 560,265 560,325
         V 400 Q 560,460 500,460 H 80 Q 20,460 20,400
         V 80 Q 20,20 80,20 Z"
      fill="none" stroke="#96704C" stroke-width="1.5" filter="url(#g)" opacity="0.6"
    />
  </svg>
</div>

</body></html>

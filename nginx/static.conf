server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/;
    index index.html;

    # No cache for HTML files
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # No cache for RSC payload files (.txt)
    location ~* \.txt$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Content-Type "text/x-component";
    }

    # Cache Static Assets (1 Year)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|glb|gltf|hdr|mp3|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA Fallback with RSC support
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";

        if ($http_rsc = "1") {
            rewrite ^/$ /index.txt last;
            rewrite ^(.+)/$ $1/index.txt last;
            rewrite ^(.+)$ $1.txt last;
        }

        try_files $uri $uri/ $uri.html /index.html;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/octet-stream text/x-component;
}

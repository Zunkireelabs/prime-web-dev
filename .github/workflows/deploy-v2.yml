name: Deploy V2

on:
  push:
    branches: [v2]
  workflow_dispatch:

concurrency:
  group: deploy-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}" \
              'set -e
               V2_DIR="/home/zunkireelabs/devprojects/websiteprojects/Prime-web-v2"

               # Clone if first time, otherwise just fetch
               if [ ! -d "$V2_DIR" ]; then
                 git clone -b v2 git@github.com:Zunkireelabs/prime-web-dev.git "$V2_DIR"
               fi

               cd "$V2_DIR"
               git fetch --prune origin v2
               git checkout v2
               git reset --hard origin/v2
               ./deploy-v2.sh'

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://v2-primetiles.zunkireelabs.com/)
            echo "Attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "Health check failed"
          exit 1

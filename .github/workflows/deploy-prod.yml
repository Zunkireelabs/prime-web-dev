name: Deploy Production

# Auto-deploys on push to `main`; also runnable manually via workflow_dispatch.
# cPanel blocks inbound datacenter IPs (FTP/SSH) and cannot build (LVE memory cap),
# so we build here and publish the static export as a GitHub Release asset
# (`prod-latest`). A cron job on the cPanel box pulls + extracts it (outbound only).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env.local
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SANITY_PROJECT_ID=3jv6o4t6
          NEXT_PUBLIC_SANITY_DATASET=production
          NEXT_PUBLIC_CATALOG_CRM_ENDPOINT=https://lead-crm.zunkireelabs.com/api/public/submit/prime-ceramics/download-catalogue
          EOF
          echo "NEXT_PUBLIC_CRM_ENDPOINT=${{ secrets.NEXT_PUBLIC_CRM_ENDPOINT }}" >> .env.local
          echo "NEXT_PUBLIC_CRM_API_KEY=${{ secrets.NEXT_PUBLIC_CRM_API_KEY }}" >> .env.local

      - name: Build
        run: npm run build

      - name: Publish built site to prod-dist branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          touch .nojekyll
          git init -q
          git checkout -q -b prod-dist
          git config user.email "ci@zunkireelabs"
          git config user.name "prime-ci"
          git add -A
          git commit -qm "prod build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prod-dist

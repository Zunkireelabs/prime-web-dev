name: Deploy Production

# Manual-only. No push trigger — production never deploys without an explicit click.
# A GitHub Environments gate on `production` (configured in repo settings → Environments)
# can require reviewer approval before this job runs.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}" \
              'set -e
               cd /home/zunkireelabs/devprojects/websiteprojects/Prime-web-prod
               git fetch --prune origin main
               git checkout main
               git reset --hard origin/main
               ./deploy-prod.sh'

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://primeceramics.com.np/)
            echo "Attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "Health check failed"
          exit 1

name: Rebuild on Sanity Content Change

on:
  repository_dispatch:
    types: [sanity-content-updated]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}" \
              "set -e
               cd /home/zunkireelabs/devprojects/websiteprojects/Prime-web-v2
               git fetch --prune origin staging
               git checkout staging
               git reset --hard origin/staging
               grep -q 'SANITY_WEBHOOK_SECRET' .env.local \
                 && sed -i 's/SANITY_WEBHOOK_SECRET=.*/SANITY_WEBHOOK_SECRET=${{ secrets.SANITY_WEBHOOK_SECRET }}/' .env.local \
                 || echo 'SANITY_WEBHOOK_SECRET=${{ secrets.SANITY_WEBHOOK_SECRET }}' >> .env.local
               ./deploy-staging.sh"

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://dev-primetiles.zunkireelabs.com/)
            echo "Attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "Health check failed"
          exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}" \
              'set -e
               cd /home/zunkireelabs/devprojects/websiteprojects/Prime-web-prod
               git fetch --prune origin main
               git checkout main
               git reset --hard origin/main
               ./deploy-prod.sh'

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://primeceramics.com.np/)
            echo "Attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "Health check failed"
          exit 1

name: Rebuild on Sanity Content Change

on:
  repository_dispatch:
    types: [sanity-content-updated]

permissions:
  contents: write

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}" \
              "set -e
               cd /home/zunkireelabs/devprojects/websiteprojects/Prime-web-v2
               git fetch --prune origin staging
               git checkout staging
               git reset --hard origin/staging
               grep -q 'SANITY_WEBHOOK_SECRET' .env.local \
                 && sed -i 's/SANITY_WEBHOOK_SECRET=.*/SANITY_WEBHOOK_SECRET=${{ secrets.SANITY_WEBHOOK_SECRET }}/' .env.local \
                 || echo 'SANITY_WEBHOOK_SECRET=${{ secrets.SANITY_WEBHOOK_SECRET }}' >> .env.local
               ./deploy-staging.sh"

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://dev-primetiles.zunkireelabs.com/)
            echo "Attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "Health check failed"
          exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env.local
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SANITY_PROJECT_ID=3jv6o4t6
          NEXT_PUBLIC_SANITY_DATASET=production
          NEXT_PUBLIC_CATALOG_CRM_ENDPOINT=https://lead-crm.zunkireelabs.com/api/public/submit/prime-ceramics/download-catalogue
          EOF
          echo "NEXT_PUBLIC_CRM_ENDPOINT=${{ secrets.NEXT_PUBLIC_CRM_ENDPOINT }}" >> .env.local
          echo "NEXT_PUBLIC_CRM_API_KEY=${{ secrets.NEXT_PUBLIC_CRM_API_KEY }}" >> .env.local

      - name: Build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: 3jv6o4t6
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_CATALOG_CRM_ENDPOINT: https://lead-crm.zunkireelabs.com/api/public/submit/prime-ceramics/download-catalogue
          NEXT_PUBLIC_CRM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CRM_ENDPOINT }}
          NEXT_PUBLIC_CRM_API_KEY: ${{ secrets.NEXT_PUBLIC_CRM_API_KEY }}
        run: npm run build

      - name: Publish built site to prod-dist branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          touch .nojekyll
          git init -q
          git checkout -q -b prod-dist
          git config user.email "ci@zunkireelabs"
          git config user.name "prime-ci"
          git add -A
          git commit -qm "prod build from Sanity update"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prod-dist

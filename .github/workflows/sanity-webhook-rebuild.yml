name: Rebuild on Sanity Content Change

on:
  repository_dispatch:
    types: [sanity-content-updated]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}" \
              "set -e
               cd /home/zunkireelabs/devprojects/websiteprojects/Prime-web-v2
               git fetch --prune origin staging
               git checkout staging
               git reset --hard origin/staging
               grep -q 'SANITY_WEBHOOK_SECRET' .env.local \
                 && sed -i 's/SANITY_WEBHOOK_SECRET=.*/SANITY_WEBHOOK_SECRET=${{ secrets.SANITY_WEBHOOK_SECRET }}/' .env.local \
                 || echo 'SANITY_WEBHOOK_SECRET=${{ secrets.SANITY_WEBHOOK_SECRET }}' >> .env.local
               ./deploy-staging.sh"

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://dev-primetiles.zunkireelabs.com/)
            echo "Attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "Health check failed"
          exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env.local
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SANITY_PROJECT_ID=3jv6o4t6
          NEXT_PUBLIC_SANITY_DATASET=production
          NEXT_PUBLIC_CATALOG_CRM_ENDPOINT=https://lead-crm.zunkireelabs.com/api/public/submit/prime-ceramics/download-catalogue
          EOF
          echo "NEXT_PUBLIC_CRM_ENDPOINT=${{ secrets.NEXT_PUBLIC_CRM_ENDPOINT }}" >> .env.local
          echo "NEXT_PUBLIC_CRM_API_KEY=${{ secrets.NEXT_PUBLIC_CRM_API_KEY }}" >> .env.local

      - name: Build
        run: npm run build

      - name: Package output
        run: |
          cd out && zip -r ../site.zip . && cd ..

      - name: Upload zip via FTP
        run: |
          curl --ftp-ssl --ssl-reqd \
               -u "${{ secrets.CPANEL_FTP_USER }}:${{ secrets.CPANEL_FTP_PASS }}" \
               -T site.zip \
               "ftp://${{ secrets.CPANEL_FTP_HOST }}/public_html/site.zip"

      - name: Extract via cPanel API
        run: |
          curl -sk \
               -u "${{ secrets.CPANEL_FTP_USER }}:${{ secrets.CPANEL_FTP_PASS }}" \
               "https://${{ secrets.CPANEL_FTP_HOST }}:2083/execute/Fileman/extract" \
               -d "dir=%2Fpublic_html&files%5B0%5D=site.zip" | tee /tmp/extract.json
          grep -q '"status":1' /tmp/extract.json || { echo "Extract failed"; cat /tmp/extract.json; exit 1; }

      - name: Delete zip via cPanel API
        run: |
          curl -sk \
               -u "${{ secrets.CPANEL_FTP_USER }}:${{ secrets.CPANEL_FTP_PASS }}" \
               "https://${{ secrets.CPANEL_FTP_HOST }}:2083/execute/Fileman/delete_files" \
               -d "dir=%2Fpublic_html&files%5B0%5D=site.zip" > /dev/null

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://primeceramics.com.np/)
            echo "Attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "Health check failed"
          exit 1
